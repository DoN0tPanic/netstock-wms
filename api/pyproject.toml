[project]
name = "netstock-api"
version = "1.0.0"
description = "NetStock — API di gestione magazzino materiale di rete"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.9,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    "asyncpg>=0.30,<0.31",
    "argon2-cffi>=23.1,<24.0",
    "python-multipart>=0.0.20,<0.0.21",
    "pillow>=11,<12",
    "opencv-python-headless>=4.10,<5.0",
    "pytesseract>=0.3,<0.4",
    "zxing-cpp>=2.2,<3.0",
    "httpx>=0.28,<0.29",
    "structlog>=24,<25",
    "apscheduler>=3.10,<4.0",
    "openpyxl>=3.1,<4.0",
    "segno>=1.6,<2.0",
    "pypdfium2>=4.30",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # `str, Enum` → `StrEnum` cambia cosa restituisce `str(membro)`: oggi il nome
  # del membro, con StrEnum il valore. Questi enum finiscono in colonne
  # SQLAlchemy, in schemi Pydantic e in stringhe formattate, quindi la
  # migrazione va fatta guardando ogni punto d'uso — non con una correzione
  # automatica il giorno prima di pubblicare.
  "UP042",
  # Sintassi generica di PEP 695: modernizzazione puramente stilistica su
  # `Page` e sul costruttore dei router, dove i generici passano da Pydantic.
  # Nessun guadagno che giustifichi il rischio adesso.
  "UP046", "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Righe lunghe che stanno **dentro una stringa**, non nel codice: SQL, messaggi
# all'operatore e il prompt di sistema del modello. Spezzarle cambierebbe il
# contenuto — un prompt riscritto è un comportamento diverso — e `# noqa` non
# si può mettere dentro un letterale. L'eccezione è per file e motivata, non un
# limite alzato per tutti.
"app/api/v1/inventory.py" = ["E501"]              # query SQL
"app/middleware/rate_limit.py" = ["E501"]         # messaggi di errore
"app/services/movements.py" = ["E501"]            # messaggi di errore
"app/services/extraction/prompts.py" = ["E501"]   # prompt di sistema
"tests/test_ledger_append_only.py" = ["E501"]     # SQL di prova

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` — a
# function call in a default argument is the intended pattern here, not the
# mutable-default-argument bug B008 exists to catch.
# `require_role` è una fabbrica di dipendenze: `Depends(require_role(...))` la
# chiama una volta all'importazione per ottenere la dipendenza, quindi vale la
# stessa esenzione dei costrutti FastAPI qui sopra.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.File", "fastapi.Form", "fastapi.Cookie", "fastapi.Header", "app.deps.require_role"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: app.db.engine/AsyncSessionLocal are module-level
# singletons created once at import time and bound to whatever event loop
# is running then. pytest-asyncio's default (a fresh loop per test
# function) makes asyncpg's pooled connections outlive the loop they were
# opened on, surfacing as "RuntimeError: Event loop is closed" on a later
# test's teardown.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
