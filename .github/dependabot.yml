# Aggiornamenti proposti, mai applicati da soli. Le versioni sono bloccate
# apposta (api/requirements.txt, web/package-lock.json, etichette esatte delle
# immagini): cambiano solo così, come pull request che passano dalla CI — test,
# licenze, dati sensibili — prima che qualcuno decida di accettarle.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      correzioni:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      correzioni:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Python e Node si aggiornano per correzioni; il salto di versione si
      # decide a mano, perché cambia le ruote binarie e gli strumenti di build.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
      # nginx: i rami con la minore dispari sono di sviluppo; il ramo stabile
      # successivo si sceglie a mano.
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # Da PostgreSQL 16 a 17 non si passa cambiando un'etichetta: i file del
      # database vanno migrati. Accettata con un clic, una proposta simile
      # lascerebbe il database fermo al primo riavvio.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
